# ============================================================
# General
# ============================================================

# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Allow tmux copy-mode selections to reach the client clipboard via OSC 52
set -s set-clipboard external

# Use modern tmux capabilities and advertise RGB for xterm-compatible clients
set -g default-terminal "tmux-256color"
set -s 'terminal-features[3]' 'xterm-256color:RGB'

# Allow applications to detect focus changes
set -g focus-events on

# Keep a large scrollback history
set -g history-limit 50000

# Windows and panes start at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after closing one
set -g renumber-windows on

# Keep window names stable
set -g automatic-rename off


# ============================================================
# Pane navigation — Vim style
# ============================================================

# Move between panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ============================================================
# Splits and windows
# ============================================================

# Split the current directory
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Swap Up
bind u swap-pane -U

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# ============================================================
# Copy mode — Vim style
# ============================================================

setw -g mode-keys vi

# Start selection
bind-key -T copy-mode-vi v send -X begin-selection

# Copy selection and exit copy mode
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel


# ============================================================
# Vim / terminal responsiveness
# ============================================================

# Reduce delay when pressing Escape
set -g escape-time 10


# ============================================================
# Plugins
# ============================================================

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Persist sessions; Resurrect also provides manual save/restore with prefix + Ctrl-s / Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save every 15 minutes and restore when the tmux server starts
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'